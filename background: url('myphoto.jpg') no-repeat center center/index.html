<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EID Mubarak Khushi</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    text-align: center;
    color: white;
    background: url('https://images.unsplash.com/photo-1608889175313-74b5b4c9a5c5') no-repeat center center/cover;
    height: 100vh;
    overflow: hidden;
}

.overlay {
    background: rgba(0,0,0,0.6);
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    font-size: 50px;
    color: gold;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px gold; }
    to { text-shadow: 0 0 25px orange; }
}

.question {
    font-size: 28px;
    margin-top: 20px;
}

#typed {
    font-size: 24px;
    margin-top: 15px;
    color: #00ffcc;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: gold;
    cursor: pointer;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
}
</style>
</head>

<body>

<div class="overlay">
    <h1>EID Mubarak Khushi ✨</h1>
    <div class="question">১৩ মে এটা কিসের তারিখ?</div>
    <div id="typed"></div>
    <button onclick="playMusic()">🎵 Music Play</button>
</div>

<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Confetti Script -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// Auto Typing Effect
let text = "আজ একটি বিশেষ দিনের স্মৃতি 🎉";
let i = 0;
function typing() {
    if (i < text.length) {
        document.getElementById("typed").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing, 70);
    }
}
typing();

// Music Play
function playMusic() {
    document.getElementById("bgMusic").play();
    confetti({
        particleCount: 200,
        spread: 120
    });
}
</script>

</body>
</html>
